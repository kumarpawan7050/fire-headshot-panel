
name: Build FIRE HEADSHOT PANEL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          mkdir unpack
          unzip -q "$(find . -maxdepth 1 -name '*.zip' -print -quit)" -d unpack

      - name: Build APK
        run: |
          cd unpack/FIRE_HEADSHOT_PANEL
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FIRE-HEADSHOT-PANEL-APK
          path: unpack/FIRE_HEADSHOT_PANEL/app/build/outputs/apk/debug/app-debug.apk
          
